name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @sot/shared build

      - name: Generate Android project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --clean

      - name: Build APK
        id: build
        working-directory: apps/mobile/android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties

          # Check key prerequisites
          echo "::group::Pre-build checks"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "node version: $(node --version)"
          echo "npm version: $(npm --version)"

          # Can node find expo CLI from here?
          NODE_TEST=$(node -e "
            try {
              const p = require.resolve('expo/package.json');
              console.log('expo found at:', p);
            } catch(e) {
              console.log('expo NOT found:', e.message);
            }
            try {
              const p = require.resolve('@expo/cli/package.json');
              console.log('@expo/cli found at:', p);
            } catch(e) {
              console.log('@expo/cli NOT found:', e.message);
            }
          " 2>&1)
          echo "$NODE_TEST"
          echo "::endgroup::"

          # Run the build with explicit module target
          echo "::group::Gradle Build"
          ./gradlew :app:assembleDebug --no-build-cache 2>&1 | tee build.log
          GRADLE_EXIT=${PIPESTATUS[0]}
          echo "Gradle exit code: $GRADLE_EXIT"
          echo "::endgroup::"

          # Search for any APK
          echo "::group::Build Results"
          APKS=$(find . -name "*.apk" 2>/dev/null)
          if [ -n "$APKS" ]; then
            for apk in $APKS; do
              SIZE=$(ls -lh "$apk" | awk '{print $5}')
              echo "::notice::APK: $apk ($SIZE)"
            done
          else
            echo "::warning::No APK files found!"
            echo "app/build exists: $(test -d app/build && echo yes || echo no)"
            if [ -d app/build ]; then
              echo "build dirs:"
              find app/build -type d 2>/dev/null | head -20
            fi
            # Check gradle output for key indicators
            echo "Key lines from build log:"
            grep -i "BUILD\|FAILED\|error\|apk\|bundle\|warning" build.log 2>/dev/null | tail -20
          fi
          echo "::endgroup::"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sot-debug-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
