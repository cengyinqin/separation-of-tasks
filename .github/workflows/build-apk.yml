name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @sot/shared build

      - name: Generate Android project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --clean

      - name: Diagnose module resolution
        working-directory: apps/mobile/android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "ANDROID_HOME=$ANDROID_HOME"

          # Test if node can find expo from android dir
          EXPO_PATH=$(node -e "try{console.log(require.resolve('expo/package.json'))}catch(e){console.log('NOT_FOUND:'+e.message)}" 2>&1)
          echo "::notice::expo resolve from android/: $EXPO_PATH"

          CLI_PATH=$(node -e "try{console.log(require.resolve('@expo/cli/package.json'))}catch(e){console.log('NOT_FOUND:'+e.message)}" 2>&1)
          echo "::notice::@expo/cli resolve from android/: $CLI_PATH"

          RN_PATH=$(node -e "try{console.log(require.resolve('react-native/package.json'))}catch(e){console.log('NOT_FOUND:'+e.message)}" 2>&1)
          echo "::notice::react-native resolve from android/: $RN_PATH"

          # Check if node_modules are linked properly
          ls -la ../node_modules/expo 2>&1 || echo "::warning::No expo in mobile node_modules"
          ls -la ../node_modules/@expo/cli 2>&1 || echo "::warning::No @expo/cli in mobile node_modules"
          ls -la ../node_modules/react-native 2>&1 || echo "::warning::No react-native in mobile node_modules"

      - name: Build APK
        id: build
        working-directory: apps/mobile/android
        run: |
          ./gradlew :app:assembleDebug --no-build-cache 2>&1 | tee build.log
          GRADLE_EXIT=${PIPESTATUS[0]}
          echo "::notice::Gradle exit code: $GRADLE_EXIT"

          # Show key lines from build log
          echo "::notice::Build log BUILD line: $(grep 'BUILD' build.log 2>/dev/null | tail -1 || echo 'none')"
          echo "::notice::Build log tasks: $(grep -oP '(?<=Task :).*' build.log 2>/dev/null | head -10 | tr '\n' ' ' || echo 'none')"

          # Check build directory
          if [ -d app/build ]; then
            BUILD_DIRS=$(find app/build -type d 2>/dev/null | head -20 | tr '\n' ' ')
            echo "::notice::app/build dirs: $BUILD_DIRS"
          else
            echo "::warning::app/build/ does not exist!"
          fi

          # Find APKs
          APKS=$(find . -name "*.apk" 2>/dev/null)
          if [ -n "$APKS" ]; then
            for apk in $APKS; do
              SIZE=$(ls -lh "$apk" | awk '{print $5}')
              echo "::notice::APK: $apk ($SIZE)"
            done
          else
            echo "::warning::No APK files found anywhere"
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sot-debug-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
